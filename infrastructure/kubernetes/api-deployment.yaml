apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix-api
  labels:
    app: helix-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helix-api
  template:
    metadata:
      labels:
        app: helix-api
    spec:
      containers:
        - name: api
          image: helix-api:latest
          ports:
            - containerPort: 4000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: helix-secrets
                  key: database-url
            - name: REDIS_HOST
              value: helix-redis
---
apiVersion: v1
kind: Service
metadata:
  name: helix-api
spec:
  selector:
    app: helix-api
  ports:
    - port: 4000
      targetPort: 4000
